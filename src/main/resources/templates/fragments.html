<!DOCTYPE html>

<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">


<!-- =========================================================
     SHARED HEAD
     ========================================================= -->
<head th:fragment="head(title)">

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title th:text="${title} + ' | USP SpaceHub'">
        USP SpaceHub
    </title>

    <link rel="stylesheet"
          th:href="@{/css/app.css}">

</head>


<body>


<!-- =========================================================
     SHARED NAVIGATION BAR
     ========================================================= -->
<nav th:fragment="nav"
     class="topbar">

    <div class="topbar-inner">


        <!-- =================================================
             SPACEHUB LOGO
             ================================================= -->
        <a th:href="@{/dashboard}"
           class="nav-logo">


            <!-- USP BLOCK -->
            <div class="nav-logo-mark">

                USP

            </div>


            <!-- USP / SPACEHUB TEXT -->
            <div class="nav-logo-text">

                <span class="nav-logo-small">
                    USP
                </span>

                <span class="nav-logo-title">
                    SpaceHub
                </span>

            </div>

        </a>



        <!-- =================================================
             NAVIGATION LINKS
             ================================================= -->
        <div class="topbar-links">


            <!-- =================================================
                 ALL LOGGED-IN USERS
                 ================================================= -->
            <a th:href="@{/dashboard}">
                Dashboard
            </a>



            <!-- =================================================
                 USER MANAGEMENT

                 ADMIN     = YES
                 IT_ADMIN  = YES
                 LECTURER  = NO
                 STUDENT   = NO
                 ================================================= -->
            <a sec:authorize="hasAnyRole('ADMIN','IT_ADMIN')"
               th:href="@{/admin/users}">

                User Management

            </a>



            <!-- =================================================
                 ROOM MANAGEMENT

                 ADMIN     = YES
                 IT_ADMIN  = YES
                 LECTURER  = NO
                 STUDENT   = NO
                 ================================================= -->
            <a sec:authorize="hasAnyRole('ADMIN','IT_ADMIN')"
               th:href="@{/admin/rooms}">

                Rooms

            </a>



            <!-- =================================================
                 APPROVALS

                 ADMIN ONLY
                 ================================================= -->
            <a sec:authorize="hasRole('ADMIN')"
               th:href="@{/admin/approvals}">

                Approvals

            </a>



            <!-- =================================================
                 COURSE MANAGEMENT

                 ADMIN ONLY
                 ================================================= -->
            <a sec:authorize="hasRole('ADMIN')"
               th:href="@{/admin/courses}">

                Courses

            </a>



            <!-- =================================================
                 REPORTS

                 ADMIN ONLY
                 ================================================= -->
            <a sec:authorize="hasRole('ADMIN')"
               th:href="@{/admin/reports}">

                Reports

            </a>



            <!-- =================================================
                 OPTIMIZED SEARCH

                 ALL LOGGED-IN USERS
                 ================================================= -->
            <a th:href="@{/search}">

                Optimized Search

            </a>



            <!-- =================================================
                 MY BOOKINGS

                 ALL LOGGED-IN USERS
                 ================================================= -->
            <a th:href="@{/bookings}">

                My Bookings

            </a>



            <!-- =================================================
                 CALENDAR

                 ALL LOGGED-IN USERS
                 ================================================= -->
            <a th:href="@{/calendar}">

                Calendar

            </a>



            <!-- =================================================
                 NOTIFICATIONS

                 ALL LOGGED-IN USERS
                 ================================================= -->
            <a th:href="@{/notifications}">

                Notifications

            </a>



            <!-- =================================================
                 PROFILE

                 ALL LOGGED-IN USERS
                 ================================================= -->
            <a th:href="@{/profile}">

                Profile

            </a>



            <!-- =================================================
                 SIGN OUT
                 ================================================= -->
            <form th:action="@{/logout}"
                  method="post"
                  class="topbar-logout-form">

                <button type="submit"
                        class="topbar-signout">

                    Sign out

                </button>

            </form>


        </div>


    </div>

</nav>



<!-- =========================================================
     SHARED ALERTS
     ========================================================= -->
<div th:fragment="alerts"
     class="alerts-wrapper">


    <!-- =====================================================
         SUCCESS MESSAGE
         ===================================================== -->
    <div th:if="${success}"
         class="alert success">

        <span class="alert-icon">
            ✓
        </span>

        <span th:text="${success}">
            Operation completed successfully.
        </span>

    </div>



    <!-- =====================================================
         ERROR MESSAGE
         ===================================================== -->
    <div th:if="${error}"
         class="alert error">

        <span class="alert-icon">
            !
        </span>

        <span th:text="${error}">
            Something went wrong.
        </span>

    </div>


</div>


</body>

</html>
