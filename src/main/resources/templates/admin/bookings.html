<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Booking administration')}"></head>
<body>
<nav th:replace="~{fragments :: nav}"></nav>
<main class="container">
    <div th:replace="~{fragments :: alerts}"></div>
    <section class="page-head">
        <div>
            <p class="eyebrow">BOOKING ADMINISTRATION</p>
            <h1>All booking requests</h1>
            <p>Inspect booking history, cancel an active/approved booking, or propose a valid reallocation.</p>
        </div>
    </section>
    <section class="panel table-wrap">
        <table>
            <thead>
            <tr>
                <th>ID</th>
                <th>Requester</th>
                <th>Type/course</th>
                <th>Room</th>
                <th>Date/time</th>
                <th>Status</th>
                <th>Decision</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="b:${bookings}">
                <td th:text="${b.id}"></td>
                <td th:text="${b.requester.name}"></td>
                <td th:text="${b.type}+' / '+${b.course!=null?b.course.code:'ECA'}"></td>
                <td th:text="${b.room.code}"></td>
                <td th:text="${b.date}+' '+${b.startTime}+'–'+${b.endTime}"></td>
                <td><span class="status" th:classappend="${b.status}" th:text="${b.status}"></span></td>
                <td class="small" th:text="${b.adminDecisionReason}"></td>
                <td class="buttons">
                    <form th:if="${b.status.name()!='CANCELLED'&&b.status.name()!='REJECTED'}" th:action="@{'/admin/bookings/'+${b.id}+'/suggest-move'}" method="post">
                        <button class="btn ghost small-btn">Suggest move</button>
                    </form>
                    <form th:if="${b.status.name()!='CANCELLED'&&b.status.name()!='REJECTED'}" th:action="@{'/admin/bookings/'+${b.id}+'/cancel'}" method="post">
                        <button class="btn danger small-btn">Cancel</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </section>
</main>
</body>
</html>
