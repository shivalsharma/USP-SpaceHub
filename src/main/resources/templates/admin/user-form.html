<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('User form')}"></head>
<body>
<nav th:replace="~{fragments :: nav}"></nav>
<main class="container narrow">
    <section class="page-head">
        <div>
            <p class="eyebrow">ACCOUNT</p>
            <h1 th:text="${form.id==null}?'Add user':'Edit user'"></h1>
        </div>
    </section>
    <form th:action="@{/admin/users/save}" th:object="${form}" method="post" class="panel form-grid">
        <input type="hidden" th:field="*{id}">
        <label>User / staff ID<input th:field="*{userCode}" required></label>
        <label>Name<input th:field="*{name}" required></label>
        <label>Email<input type="email" th:field="*{email}" required></label>
        <label>Role<select th:field="*{role}"><option th:each="r:${roles}" th:value="${r}" th:text="${r}"></option></select></label>
        <label>Department<select th:field="*{department}"><option value="">Unassigned</option><option th:each="d:${departments}" th:value="${d}" th:text="${#strings.replace(d,'_',' ')}"></option></select></label>
        <label>Daily booking override<input type="number" min="1" th:field="*{maxDailyBookings}" placeholder="Use system default"></label>
        <label>Weekly booking override<input type="number" min="1" th:field="*{maxWeeklyBookings}" placeholder="Use system default"></label>
        <label>Password <small th:text="${form.id==null}?'Required, 8+ characters':'Leave blank to keep current; enter a value to reset'"></small><input type="password" th:field="*{password}"></label>
        <label class="check option-check"><input type="checkbox" th:field="*{active}"> Active account</label>
        <div class="span-2 buttons">
            <button class="btn primary">Save user</button>
            <a class="btn ghost" th:href="@{/admin/users}">Cancel</a>
        </div>
        <div class="span-2 validation" th:if="${#fields.hasAnyErrors()}">
            <p th:each="e:${#fields.allErrors()}" th:text="${e}"></p>
        </div>
    </form>
</main>
</body>
</html>
