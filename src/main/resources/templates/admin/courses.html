<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Courses')}"></head>
<body>
<nav th:replace="~{fragments :: nav}"></nav>
<main class="container">
    <div th:replace="~{fragments :: alerts}"></div>
    <section class="page-head">
        <div>
            <p class="eyebrow">TEACHING NEEDS</p>
            <h1>Course management</h1>
        </div>
        <a class="btn primary" th:href="@{/admin/courses/new}">Add course</a>
    </section>
    <section class="panel table-wrap">
        <table>
            <thead>
            <tr>
                <th>Course</th>
                <th>Roll</th>
                <th>Required sessions</th>
                <th>Weekly max</th>
                <th>Prime allowance</th>
                <th>Lecturers</th>
                <th>Facilities</th>
                <th></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="c:${courses}">
                <td><b th:text="${c.code}"></b><br><span th:text="${c.name}"></span></td>
                <td th:text="${c.courseRoll}"></td>
                <td th:text="'LAB '+${c.requiredLabSessions}+' / TUTORIAL '+${c.requiredTutorialSessions}"></td>
                <td th:text="${c.maxWeeklyBookings}"></td>
                <td th:text="${c.primeTimeAllowance}"></td>
                <td><span th:each="l:${c.lecturers}" th:text="${l.name}+' '"></span></td>
                <td th:text="${#strings.listJoin(c.requiredFacilities,', ')}"></td>
                <td><a class="btn ghost small-btn" th:href="@{'/admin/courses/'+${c.id}+'/edit'}">Edit</a></td>
            </tr>
            </tbody>
        </table>
    </section>
</main>
</body>
</html>
