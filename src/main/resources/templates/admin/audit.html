<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Audit log')}"></head>
<body>
<nav th:replace="~{fragments :: nav}"></nav>
<main class="container">
    <section class="page-head">
        <div>
            <p class="eyebrow">ACCOUNTABILITY</p>
            <h1>Audit log</h1>
            <p>Major booking, admin, alternative and configuration actions are recorded for explainability.</p>
        </div>
    </section>
    <section class="panel table-wrap">
        <table>
            <thead>
            <tr>
                <th>Time</th>
                <th>Actor</th>
                <th>Action</th>
                <th>Entity</th>
                <th>Details</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="a:${logs}">
                <td th:text="${a.createdAt}"></td>
                <td th:text="${a.actorEmail}"></td>
                <td><b th:text="${a.action}"></b></td>
                <td th:text="${a.entityType}+' #'+${a.entityId}"></td>
                <td class="small" th:text="${a.details}"></td>
            </tr>
            </tbody>
        </table>
    </section>
</main>
</body>
</html>
