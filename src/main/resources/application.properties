spring.application.name=USP SpaceHub
server.port=8080

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/usp_spacehub?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Pacific/Fiji
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=SpaceHub@123

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# Disable H2 Console
spring.h2.console.enabled=false

# Thymeleaf Configuration
spring.thymeleaf.cache=false

# Enable Hidden HTTP Methods
spring.mvc.hiddenmethod.filter.enabled=true

# Mail Configuration
app.mail.enabled=false
# ==========================================================
# Profile picture uploads
# ==========================================================

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
# ==========================================================
# EMAIL / SMTP
# ==========================================================

spring.mail.host=smtp.gmail.com
spring.mail.port=587

spring.mail.username=${SPACEHUB_MAIL_USERNAME:}
spring.mail.password=${SPACEHUB_MAIL_PASSWORD:}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

spring.mail.default-encoding=UTF-8

# SpaceHub email settings
spacehub.mail.from=${SPACEHUB_MAIL_USERNAME:no-reply@spacehub.local}
spacehub.base-url=${SPACEHUB_BASE_URL:http://localhost:8080}