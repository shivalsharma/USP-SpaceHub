<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Rooms')}"></head>
<body>
<nav th:replace="~{fragments :: nav}"></nav>
<main class="container">
    <div th:replace="~{fragments :: alerts}"></div>
    <section class="page-head">
        <div>
            <p class="eyebrow">ROOM INVENTORY</p>
            <h1>Room management</h1>
        </div>
        <a class="btn primary" th:href="@{/admin/rooms/new}">Add room</a>
    </section>
    <section class="panel table-wrap">
        <table>
            <thead>
            <tr>
                <th>Room</th>
                <th>Building</th>
                <th>Capacity</th>
                <th>Computers</th>
                <th>Projector</th>
                <th>Access</th>
                <th>Status</th>
                <th></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="r:${rooms}">
                <td><b th:text="${r.code}"></b><br><span th:text="${r.name}"></span></td>
                <td th:text="${r.building}"></td>
                <td th:text="${r.capacity}"></td>
                <td th:text="${r.operationalComputers}+'/'+${r.computerCount}"></td>
                <td th:text="${r.projectorAvailable?(r.projectorOperational?'Operational':'Faulty'):'No'}"></td>
                <td th:text="${r.accessLevel}"></td>
                <td><span class="status" th:classappend="${r.status.name()=='ACTIVE'}?' APPROVED':' REJECTED'" th:text="${r.status}"></span></td>
                <td><a class="btn ghost small-btn" th:href="@{'/admin/rooms/'+${r.id}+'/edit'}">Edit / maintenance</a></td>
            </tr>
            </tbody>
        </table>
    </section>
</main>
</body>
</html>
