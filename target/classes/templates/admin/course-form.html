<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Course form')}"></head>
<body>
<nav th:replace="~{fragments :: nav}"></nav>
<main class="container narrow">
    <section class="page-head">
        <div>
            <p class="eyebrow">COURSE POLICY</p>
            <h1 th:text="${form.id==null}?'Add course':'Edit course'"></h1>
        </div>
    </section>
    <form th:action="@{/admin/courses/save}" th:object="${form}" method="post" class="panel form-grid">
        <input type="hidden" th:field="*{id}">
        <label>Course code<input th:field="*{code}" required></label>
        <label>Course name<input th:field="*{name}" required></label>
        <label>Course roll<input type="number" min="1" th:field="*{courseRoll}" required></label>
        <label>Max weekly bookings<input type="number" min="1" th:field="*{maxWeeklyBookings}" required></label>
        <label>Required LAB sessions<input type="number" min="0" th:field="*{requiredLabSessions}"></label>
        <label>Required TUTORIAL sessions<input type="number" min="0" th:field="*{requiredTutorialSessions}"></label>
        <label>Prime-time weekly allowance<input type="number" min="0" th:field="*{primeTimeAllowance}"></label>
        <label class="check option-check"><input type="checkbox" th:field="*{active}"> Active course</label>
        <fieldset class="span-2 choice-section">
            <legend>Required facilities</legend>
            <input type="hidden" th:field="*{requiredFacilitiesCsv}" id="requiredFacilitiesCsv">
            <div class="choice-grid" data-choice-group="requiredFacilitiesCsv">
                <label class="choice" th:each="f:${facilityOptions}">
                    <input type="checkbox" th:value="${f}" th:checked="${form.requiredFacilitiesCsv != null and #strings.contains(form.requiredFacilitiesCsv,f)}">
                    <span th:text="${#strings.replace(f,'_',' ')}"></span>
                </label>
            </div>
        </fieldset>
        <fieldset class="span-2 choice-section">
            <legend>Assigned lecturers</legend>
            <div class="choice-grid lecturer-grid">
                <label class="choice" th:each="l:${lecturers}">
                    <input type="checkbox" name="lecturerIds" th:value="${l.id}" th:checked="${form.lecturerIds != null and form.lecturerIds.contains(l.id)}">
                    <span th:text="${l.userCode}+' · '+${l.name}"></span>
                </label>
            </div>
        </fieldset>
        <div class="span-2 buttons">
            <button class="btn primary">Save course</button>
            <a class="btn ghost" th:href="@{/admin/courses}">Cancel</a>
        </div>
        <div class="span-2 validation" th:if="${#fields.hasAnyErrors()}">
            <p th:each="e:${#fields.allErrors()}" th:text="${e}"></p>
        </div>
    </form>
</main>
<script>
    (function(){
        document.querySelectorAll('[data-choice-group]').forEach(g=>{
            const t=document.getElementById(g.dataset.choiceGroup);
            const sync=()=>t.value=[...g.querySelectorAll('input:checked')].map(x=>x.value).join(', ');
            g.querySelectorAll('input[type=checkbox]').forEach(x=>x.addEventListener('change',sync));
            sync();
        });
    })();
</script>
</body>
</html>
