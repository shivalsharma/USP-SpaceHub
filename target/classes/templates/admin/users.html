<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Users')}"></head>
<body>
<nav th:replace="~{fragments :: nav}"></nav>
<main class="container">
    <div th:replace="~{fragments :: alerts}"></div>
    <section class="page-head">
        <div>
            <p class="eyebrow">RBAC & ACCOUNTS</p>
            <h1>User management</h1>
        </div>
        <a class="btn primary" th:href="@{/admin/users/new}">Add user</a>
    </section>
    <section class="panel table-wrap">
        <table>
            <thead>
            <tr>
                <th>Code</th>
                <th>Name</th>
                <th>Email</th>
                <th>Role</th>
                <th>Department</th>
                <th>Status</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="u:${users}">
                <td th:text="${u.userCode}"></td>
                <td th:text="${u.name}"></td>
                <td th:text="${u.email}"></td>
                <td th:text="${u.role}"></td>
                <td th:text="${u.department}"></td>
                <td><span class="status" th:classappend="${u.active}?' APPROVED':' REJECTED'" th:text="${u.active}?'ACTIVE':'DISABLED'"></span></td>
                <td class="buttons">
                    <a class="btn ghost small-btn" th:href="@{'/admin/users/'+${u.id}+'/edit'}">Edit / reset password</a>
                    <form th:action="@{'/admin/users/'+${u.id}+'/toggle'}" method="post">
                        <button class="btn ghost small-btn" th:text="${u.active}?'Disable':'Reactivate'"></button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </section>
</main>
</body>
</html>
