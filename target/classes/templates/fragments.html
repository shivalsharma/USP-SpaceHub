<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' | USP SpaceHub'">USP SpaceHub</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<nav th:fragment="nav" class="topbar">
    <a class="brand" th:href="@{/dashboard}">
        <span class="brand-mark">USP</span><span>SpaceHub</span>
    </a>
    <div class="navlinks">
        <a th:href="@{/dashboard}">Dashboard</a>
        <a th:href="@{/search}">Optimized Search</a>
        <a th:href="@{/bookings}">My Bookings</a>
        <a th:href="@{/calendar}">Calendar</a>
        <a th:href="@{/notifications}">Notifications</a>
        <a th:href="@{/profile}">Profile</a>
        <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin}">Admin</a>
        <a sec:authorize="hasRole('IT_ADMIN')" th:href="@{/admin/users}">IT Users</a>
        <a sec:authorize="hasRole('IT_ADMIN')" th:href="@{/admin/rooms}">IT Rooms</a>
        <form class="inline" th:action="@{/logout}" method="post">
            <button class="link-btn" type="submit">Sign out</button>
        </form>
    </div>
</nav>
<div th:fragment="alerts">
    <div th:if="${success}" class="alert success" th:text="${success}"></div>
    <div th:if="${error}" class="alert error" th:text="${error}"></div>
</div>
</body>
</html>
